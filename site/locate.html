<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Bird | Stratum Real Estate</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="locate-wrap">
  <div class="locate-card">
    <img class="logo" src="assets/logo.jpg" alt="Stratum Real Estate Group">
    <div class="locate-spinner" id="spinner"></div>
    <h2 id="locateTitle">Finding your location&hellip;</h2>
    <p id="locateSub">Checking if you're standing in front of one of Scott's listings.</p>
    <a class="skip" id="skipLink" href="index.html">Skip &mdash; continue</a>
  </div>
</div>
<div id="footerMount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/site.js"></script>
<script>
(async function () {
  document.getElementById('footerMount').outerHTML = Stratum.renderFooter();
  // Captured now (strips the tracking param from the URL immediately), but
  // the actual scan record is only written once we know whether GPS
  // succeeded, so it can include the coordinates when available.
  const scannedQrId = Stratum.captureQrId();

  const titleEl = document.getElementById('locateTitle');
  const subEl = document.getElementById('locateSub');
  // Only ever follow http(s) links or paths on this site — never javascript:/data:
  // URLs, which a crafted link could otherwise use to run script on this page.
  function safeDest(d) {
    try {
      const u = new URL(d, window.location.href);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? d : 'index.html';
    } catch (e) {
      return 'index.html';
    }
  }
  // Newer ("short") QR codes carry only a tracking id; where they go is stored in
  // the database and looked up here, so the code stays small and the destination
  // can be changed later without reprinting. Returns null if it can't be found.
  async function lookupDest(codeId) {
    try {
      const result = await Promise.race([
        sb.rpc('get_qr_destination', { code_id: codeId }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('lookup timed out')), 4000)),
      ]);
      return (result && !result.error && result.data) ? result.data : null;
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  // "d" is the short form used by /q links; "dest" is what older printed codes use.
  // A code with neither gets its destination from the database (home page if that fails).
  const explicitDest = urlParams.get('dest') || urlParams.get('d');
  let dest = safeDest(explicitDest || 'index.html');
  if (!explicitDest && scannedQrId) {
    const looked = await lookupDest(scannedQrId);
    if (looked) dest = safeDest(looked);
  }
  document.getElementById('skipLink').href = dest;
  function goToFallback() { window.location.replace(dest); }

  // Codes made with "Don't read the visitor's location" (n=1): log the scan, then
  // go straight to the destination — no GPS prompt, no nearby-listing check.
  if (urlParams.get('n') === '1') {
    titleEl.textContent = 'Taking you there now.';
    subEl.textContent = '';
    await Promise.race([Stratum.recordQrScan(scannedQrId), new Promise(r => setTimeout(r, 1500))]);
    goToFallback();
    return;
  }

  const MAX_DISTANCE_METERS = 30.48; // 100 feet
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  const { data: properties, error } = await sb
    .from('properties')
    .select('id, lat, lng')
    .neq('status', 'Sold')
    .not('lat', 'is', null)
    .not('lng', 'is', null);

  const locateProps = error ? [] : (properties || []);

  if (!locateProps.length) {
    Stratum.recordQrScan(scannedQrId);
    goToFallback();
  } else if (!navigator.geolocation) {
    Stratum.recordQrScan(scannedQrId);
    titleEl.textContent = "Location isn't available";
    subEl.textContent = 'Taking you there now.';
    setTimeout(goToFallback, 1200);
  } else {
    const timeoutId = setTimeout(() => {
      Stratum.recordQrScan(scannedQrId);
      titleEl.textContent = "Couldn't get a location in time";
      subEl.textContent = 'Taking you there now.';
      setTimeout(goToFallback, 900);
    }, 6000);

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timeoutId);
        const { latitude, longitude } = pos.coords;
        Stratum.recordQrScan(scannedQrId, { lat: latitude, lng: longitude });
        let nearest = null, nearestDist = Infinity;
        locateProps.forEach(p => {
          const d = haversine(latitude, longitude, p.lat, p.lng);
          if (d < nearestDist) { nearestDist = d; nearest = p; }
        });
        if (nearest && nearestDist <= MAX_DISTANCE_METERS) {
          titleEl.textContent = 'Found it!';
          subEl.textContent = 'Taking you to this property now.';
          window.location.replace('listing.html?id=' + encodeURIComponent(nearest.id));
        } else {
          titleEl.textContent = "You're not near a current listing";
          subEl.textContent = 'Taking you there now.';
          setTimeout(goToFallback, 900);
        }
      },
      () => {
        clearTimeout(timeoutId);
        Stratum.recordQrScan(scannedQrId);
        titleEl.textContent = 'Location permission not granted';
        subEl.textContent = 'Taking you there now.';
        setTimeout(goToFallback, 900);
      },
      { enableHighAccuracy: true, timeout: 5500, maximumAge: 0 }
    );
  }
})();
</script>
</body>
</html>
